services:
  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      FNRAG_DATA_DIR: /app/runtime_data
      VECTOR_BACKEND: qdrant
      GRAPH_BACKEND: neo4j
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graduation-project-password
      EMBEDDING_PROVIDER: hash
      LLM_PROVIDER: extractive
      GRADIO_SERVER_NAME: 0.0.0.0
    volumes:
      - app_data:/app/runtime_data
    depends_on:
      - qdrant
      - neo4j
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/graduation-project-password
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  app_data:
  qdrant_data:
  neo4j_data:
